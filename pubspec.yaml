name: super_fitness
description: "A cross-platform fitness tracking app with neumorphic design."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # 状态管理
  provider: ^6.1.1

  # 本地存储
  sqflite: ^2.3.2
  path_provider: ^2.1.2

  # 地图和定位（使用高德地图 SDK）
  amap_flutter_map: ^3.0.0
  amap_flutter_base: ^3.0.0

  # 路由管理
  go_router: ^13.2.0

  # 工具库
  intl: ^0.19.0
  uuid: ^4.3.3
  permission_handler: ^11.3.0
  device_info_plus: ^10.1.0

  # 本地通知
  flutter_local_notifications: ^17.0.0

  # 本地存储
  shared_preferences: ^2.2.2

  # 时区计算
  timezone: ^0.9.2

  # 图表
  fl_chart: ^0.66.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
